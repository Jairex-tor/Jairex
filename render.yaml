services:
  - type: web
    name: jairex
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && cd ../client && npm ci --include=dev && npm run build
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true